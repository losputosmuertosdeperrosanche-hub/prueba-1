/* Layout: app a pantalla completa — panel de búsqueda arriba, mapa de Alemania en el centro, hoja inferior con ficha o lista */
:root{
  --bg:#e9edf1; --panel:#ffffff; --fg:#14202b; --muted:#5a6876; --line:#d3dae1;
  --water:#dfe6ec; --land:#f7f9fb; --land-de:#ffffff; --border-de:#2b3d4f; --border-n:#b8c3cd;
  --accent:#c96a00; --accent-fg:#ffffff; --accent-soft:#fbead6; --pin:#1f4f7a; --pin-soft:#d6e4f1;
  --ok:#256d45; --ok-soft:#dcefe3; --warn:#7a5a00; --warn-soft:#f6ecc9;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --panel:#17202a; --fg:#e6edf3; --muted:#9aa8b5; --line:#2a3542;
  --water:#0b1117; --land:#141c24; --land-de:#1b2631; --border-de:#7f97ad; --border-n:#2c3a48;
  --accent:#ff9f2e; --accent-fg:#1a1205; --accent-soft:#3a2810; --pin:#7fb3e0; --pin-soft:#1c2c3c;
  --ok:#7fd3a0; --ok-soft:#1b3326; --warn:#e8c76a; --warn-soft:#3a3118; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --panel:#17202a; --fg:#e6edf3; --muted:#9aa8b5; --line:#2a3542;
  --water:#0b1117; --land:#141c24; --land-de:#1b2631; --border-de:#7f97ad; --border-n:#2c3a48;
  --accent:#ff9f2e; --accent-fg:#1a1205; --accent-soft:#3a2810; --pin:#7fb3e0; --pin-soft:#1c2c3c;
  --ok:#7fd3a0; --ok-soft:#1b3326; --warn:#e8c76a; --warn-soft:#3a3118; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;display:grid;gap:6px;z-index:500}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-family:var(--display);font-stretch:80%;font-weight:800;font-size:1.15rem;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--accent)}
.stamp{font-family:var(--mono);font-size:.66rem;color:var(--muted);letter-spacing:.03em}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.controls .full{grid-column:1/-1}
input[type=search],select{width:100%;min-width:0;font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
label.lbl{display:grid;gap:3px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;min-width:0}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.toggle{display:flex;align-items:center;gap:6px;font-size:.88rem}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.count{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.count b{color:var(--fg)}
.btn{font:inherit;font-weight:600;font-size:.85rem;padding:7px 12px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}

dd{margin:0;min-width:0;overflow-wrap:anywhere}

const LEGAL = {gmbh:"GmbH", ag:"AG", ug:"UG (haftungsbeschränkt)", kg:"KG", ohg:"OHG", ek:"e.K.", foreign:"Sociedad extranjera"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }

$("stamp").textContent = `${DATA.length} empresas reales · OpenRegister · ${META.fetched}`;

// Selector de ciudades: cuántas hay en el registro y cuántas están cargadas
const sel = $("city");
sel.innerHTML = `<option value="">Toda Alemania · ${DATA.length}</option>` + META.cities.map(c =>
  `<option value="${esc(c.name)}">${esc(c.name)} · ${c.count}${c.partial ? " (parcial)" : ""}</option>`).join("");

if (!window.L) {
  $("map").innerHTML = '<div class="err">No se pudo cargar el mapa. Comprueba la conexión y recarga la página.</div>';
  throw new Error("Leaflet no cargó");
}

const map = L.map("map", {zoomControl:true, minZoom:5, maxZoom:18, attributionControl:true, preferCanvas:false});
map.attributionControl.setPrefix(false).addAttribution('Datos: <a href="https://openregister.de" target="_blank" rel="noopener">OpenRegister</a> · Ubicaciones y límites urbanos © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · Fronteras: Natural Earth');
const DE_BOUNDS = L.latLngBounds([47.2, 5.8], [55.1, 15.1]);
map.fitBounds(DE_BOUNDS);

let geoLayer, cityLayer;
function drawGeo(){
  if (geoLayer) geoLayer.remove();
  geoLayer = L.geoJSON(GEO, {interactive:false, style: f => f.properties.de
    ? {color:css("--border-de"), weight:1.6, fillColor:css("--land-de"), fillOpacity:1}
    : {color:css("--border-n"), weight:1, fillColor:css("--land"), fillOpacity:1}}).addTo(map);
  geoLayer.bringToBack();
  if (cityLayer) cityLayer.remove();
  cityLayer = L.geoJSON(CITY_GEO, {interactive:false, style:{color:css("--pin"), weight:1.5, dashArray:"5 4", fillColor:css("--pin"), fillOpacity:.05}}).addTo(map);
}
drawGeo();
const cityLabels = L.layerGroup(META.cities.filter(c => c.label && c.lat != null).map(c => L.marker([c.lat, c.lon], {interactive:false, keyboard:false,
  icon:L.divIcon({className:"", html:`<span class="citylbl">${esc(c.name)}</span>`, iconSize:null, iconAnchor:[-8, 18]})}))).addTo(map);

const cluster = L.markerClusterGroup({showCoverageOnHover:false, maxClusterRadius:45, spiderfyOnMaxZoom:true,
  iconCreateFunction: cl => { const n = cl.getChildCount(); const s = n < 10 ? 30 : n < 100 ? 38 : 46;
    const hot = cl.getAllChildMarkers().some(m => m.options.hasContact);
    return L.divIcon({html:`<div class="cl${hot ? " hot" : ""}" style="width:${s}px;height:${s}px">${n}</div>`, className:"", iconSize:[s, s]}); }});
map.addLayer(cluster);

const markers = new Map();
function makeMarker(e){
  const has = e.k && (e.k.phone || e.k.email);
  const m = L.circleMarker([e.y, e.x], {hasContact: !!has, radius: has ? 8 : 6, weight:2, color:css(has ? "--accent" : "--pin"),
    fillColor:css(has ? "--accent" : "--pin"), fillOpacity: has ? .9 : .55});
  m.on("click", () => openDetail(e));
  m.bindTooltip(esc(e.n), {direction:"top", offset:[0,-6]});
  return m;
}
DATA.forEach(e => { if (e.y != null) markers.set(e.i, makeMarker(e)); });

function filtered(){
  const q = $("q").value.trim().toLowerCase();
  const city = sel.value, only = $("onlyContact").checked;
  return DATA.filter(e => (!city || e.c === city) && (!only || (e.k && (e.k.phone || e.k.email))) &&
    (!q || (e.n + " " + e.a + " " + e.p).toLowerCase().includes(q)));
}
let current = [];
function refresh(fit){
  current = filtered();
  cluster.clearLayers();
  cluster.addLayers(current.filter(e => markers.has(e.i)).map(e => markers.get(e.i)));
  const withContact = current.filter(e => e.k && (e.k.phone || e.k.email)).length;
  $("count").innerHTML = `<b>${current.length}</b> emp. · <b>${withContact}</b> ☎`;
  if (fit) {
    const pts = current.filter(e => e.y != null).map(e => [e.y, e.x]);
    if (sel.value && pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.08), {maxZoom:14});
    else if (!sel.value && !$("q").value.trim()) map.fitBounds(DE_BOUNDS);
    else if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.1), {maxZoom:14});
  }
  if (!$("sheet").hidden && $("sheet").dataset.mode === "list") showList();
}
let qTimer;
$("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => refresh(true), 250); });
sel.addEventListener("change", () => refresh(true));
$("onlyContact").addEventListener("change", () => refresh(false));

function copyBtn(v){ return `<button class="mini" type="button" data-copy="${esc(v)}">Copiar</button>`; }
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-copy]"); if (!b) return;
  const v = b.dataset.copy;
  try { navigator.clipboard.writeText(v).then(() => toast("Copiado"), () => toast("Mantén pulsado el texto para copiarlo")); }
  catch(_) { toast("Mantén pulsado el texto para copiarlo"); }
});

function openSheet(title, html, mode){
  $("sheetTitle").textContent = title; $("sheetBody").innerHTML = html;
  $("sheet").dataset.mode = mode; $("sheet").hidden = false; $("sheetBody").scrollTop = 0;
}
$("closeSheet").addEventListener("click", () => $("sheet").hidden = true);
document.addEventListener("keydown", ev => { if (ev.key === "Escape") $("sheet").hidden = true; });

function webFrom(url){ try { const u = new URL(url); return u.origin; } catch(_) { return ""; } }
function contactHtml(e){
  const k = e.k;
  if (!e.kc) return `<p class="note">Contacto no consultado todavía: cada consulta de contacto en OpenRegister gasta 10 créditos.</p>
    <div class="cline"><span class="v">Buscar la empresa en internet</span><a class="mini" href="https://www.google.com/search?q=${encodeURIComponent(e.n + " " + e.c)}" target="_blank" rel="noopener">Google</a></div>`;
  if (!k || (!k.phone && !k.email && !k.source_url)) return `<p class="note">OpenRegister no tiene teléfono, email ni web de esta empresa.</p>
    <div class="cline"><span class="v">Buscar la empresa en internet</span><a class="mini" href="https://www.google.com/search?q=${encodeURIComponent(e.n + " " + e.c)}" target="_blank" rel="noopener">Google</a></div>`;
  const out = [];
  if (k.phone) out.push(`<div class="cline"><div><div class="k">Teléfono</div><div class="v mono">${esc(k.phone)}</div></div><span style="display:flex;gap:6px"><a class="mini" href="tel:${esc(k.phone.replace(/[^+\d]/g, ""))}">Llamar</a>${copyBtn(k.phone)}</span></div>`);
  if (k.email) out.push(`<div class="cline"><div><div class="k">Email</div><div class="v mono">${esc(k.email)}</div></div><span style="display:flex;gap:6px"><a class="mini" href="mailto:${esc(k.email)}">Escribir</a>${copyBtn(k.email)}</span></div>`);
  const web = k.source_url ? webFrom(k.source_url) : "";
  if (web) out.push(`<div class="cline"><div><div class="k">Web</div><div class="v mono">${esc(web.replace(/^https?:\/\//, ""))}</div></div><a class="mini" href="${esc(web)}" target="_blank" rel="noopener">Abrir</a></div>`);
  if (k.vat_id) out.push(`<div class="cline"><div><div class="k">USt-IdNr. (IVA)</div><div class="v mono">${esc(k.vat_id)}</div></div>${copyBtn(k.vat_id)}</div>`);
  if (k.source_url) out.push(`<p class="note">Fuente del contacto: <a href="${esc(k.source_url)}" target="_blank" rel="noopener">${esc(k.source_url)}</a></p>`);
  return out.join("");
}
function openDetail(e){
  const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(e.a);
  const prec = e.q === "direccion" ? "" : e.q === "codigo_postal" ? `<span class="chip warn">Ubicación aproximada (código postal)</span>` : e.q === "ciudad" ? `<span class="chip warn">Ubicación aproximada (ciudad)</span>` : "";
  openSheet(e.n, `
    <div class="chips"><span class="chip ok">Activa</span><span class="chip">${esc(LEGAL[e.f] || e.f)}</span><span class="chip ac">WZ 80.01 · Seguridad privada</span>${prec}</div>
    <section><h3>Contacto</h3><div class="contact">${contactHtml(e)}</div></section>
    <section><h3>Dirección</h3><div class="cline"><span class="v">${esc(e.a)}</span><a class="mini" href="${maps}" target="_blank" rel="noopener">Google Maps</a></div></section>
    <section><h3>Registro mercantil</h3><dl>
      <dt>Registro</dt><dd class="mono">${esc(e.r)}</dd>
      <dt>Juzgado</dt><dd>Amtsgericht ${esc(e.g)}</dd>
      <dt>ID</dt><dd class="mono">${esc(e.i)} ${copyBtn(e.i)}</dd>
    </dl></section>
    <section><h3>Objeto social</h3><p class="purpose" style="margin:0">${esc(e.p) || '<span class="note">No consta.</span>'}</p></section>`, "detail");
}
function showList(){
  const items = current.slice().sort((a, b) => (!!(b.k && (b.k.phone || b.k.email)) - !!(a.k && (a.k.phone || a.k.email))) || a.n.localeCompare(b.n, "de"));
  const shown = items.slice(0, 300);
  const completas = META.queries.filter(c => c.loaded === c.total).map(c => c.name).join(", ");
  const parciales = META.queries.filter(c => c.loaded < c.total).map(c => `${c.name} (${c.loaded} de ${c.total})`).join(", ");
  const info = `<p class="note">Cargadas completas: ${esc(completas)}. Parciales: ${esc(parciales)}. Las empresas con punto naranja tienen teléfono o email.</p>`;
  openSheet(`${items.length} empresas`, info + (items.length ? `<div class="list">${shown.map(e => `<button class="item" type="button" data-id="${esc(e.i)}"><b>${e.k && (e.k.phone || e.k.email) ? '<i class="dot"></i>' : ""}${esc(e.n)}</b><span>${esc(e.a)}</span></button>`).join("")}</div>` +
    (items.length > shown.length ? `<p class="note">Se muestran 300. Busca o elige una ciudad para acotar.</p>` : "")
    : `<p class="note">Ninguna empresa coincide. Prueba con otra búsqueda o quita filtros.</p>`), "list");
}
$("listBtn").addEventListener("click", showList);
$("sheetBody").addEventListener("click", ev => {
  const b = ev.target.closest(".item"); if (!b) return;
  const e = DATA.find(x => x.i === b.dataset.id); if (!e) return;
  if (e.y != null) { const m = markers.get(e.i); cluster.zoomToShowLayer(m, () => {}); }
  openDetail(e);
});

// Cambio de tema: recolorear mapa y puntos
function recolor(){ drawGeo(); markers.forEach((m, id) => { const e = DATA.find(x => x.i === id); const has = e.k && (e.k.phone || e.k.email);
  m.setStyle({color:css(has ? "--accent" : "--pin"), fillColor:css(has ? "--accent" : "--pin")}); }); }
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", recolor); } catch(_) {}
new MutationObserver(recolor).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

refresh(false);
</script>
