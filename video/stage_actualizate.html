<script>
const TIEMPOS = window.TIEMPOS, LANG = window.LANG || 'de';
const T = TIEMPOS.inicios, DUR = TIEMPOS.duracion, N = T.length;
const TXT = {
  de: {
    s0a:'Vergleich', s0b:'Webdesigner', s0c:'oder', s0d:'KI-Agentur?',
    s1a:'Webdesigner', s1b:'Alles von Hand.', s1d:'Dauer: Tage',
    s2a:'KI-Agentur', s2b:'Mit KI.', s2c:'Wir arbeiten mit künstlicher Intelligenz.', s2d:'Dauer: Minuten',
    s3u:'Minuten', s3c:'in etwa, bis zur fertigen Website',
    s4a:'Menschliche Prüfung', s4b:'Jede Website wird vor der Abgabe geprüft.',
    s5a:'Für dein Unternehmen', s5b:'zzgl. MwSt.',
    s6a:'Am selben Tag', s6b:'Erst danach bezahlst du.',
    s7a:'Unsere Arbeiten', s7b:'Frag nach unseren anderen Projekten.', s7c:'Überzeug dich selbst.',
    s8a:'Teste uns mit einer Demo.', s8b:'Jetzt testen', s8c:'Gefällt sie dir, machen wir weiter. Du verlierst nichts.',
    s9a:'Für viele: Stunden.', s9b:'Für uns: Denken und Optimieren.',
    e1a:'Verlorene Zeit', e1b:'Bestellungen abtippen?', e1c:'Ein Formular trägt sie automatisch ein.',
    e2a:'Verlorene Zeit', e2b:'Immer dieselben Fragen?', e2c:'Die Antworten laufen automatisch.',
    e3a:'Verlorene Zeit', e3b:'Rechnungen von Hand?', e3c:'Vorlagen versenden sich selbst.',
    s13a:'Weitere Dienste', s13b:'Günstig.', s13c:'Dank KI.',
    s14a:'Für Programmierer', s14b:'Weckruf.', s14c:'Update 2026',
    s15c:'Willst du eine Website?', s15d:'Schreib uns'
  },
  ro: {
    s0a:'Comparație', s0b:'Web designer', s0c:'sau', s0d:'Agenție IA?',
    s1a:'Web designer', s1b:'Totul manual.', s1d:'Durată: zile',
    s2a:'Agenție IA', s2b:'Cu IA.', s2c:'Lucrăm cu inteligență artificială.', s2d:'Durată: minute',
    s3u:'Minute', s3c:'aproximativ, până la site-ul gata',
    s4a:'Verificare umană', s4b:'Fiecare site este verificat înainte de predare.',
    s5a:'Pentru firma ta', s5b:'+ TVA',
    s6a:'În aceeași zi', s6b:'Abia apoi plătești.',
    s7a:'Lucrări', s7b:'Vezi alte lucrări ale noastre.', s7c:'Judecă singur.',
    s8a:'Testează-ne cu<br>o demonstrație.', s8b:'Testează acum', s8c:'Dacă îți place, continuăm. Nu pierzi nimic.',
    s9a:'Pentru mulți: ore pierdute.', s9b:'Pentru noi: a gândi și a optimiza.',
    e1a:'Ore pierdute', e1b:'Comenzi copiate manual?', e1c:'Un formular le completează singur.',
    e2a:'Ore pierdute', e2b:'Aceleași întrebări?', e2c:'Răspunsurile vin automat.',
    e3a:'Ore pierdute', e3b:'Facturi și memento-uri de mână?', e3c:'Se trimit singure.',
    s13a:'Alte servicii', s13b:'Ieftine.', s13c:'Datorită IA.',
    s14a:'Pentru programatori', s14b:'Trezire.', s14c:'Actualizare 2026',
    s15c:'Vrei un site web?', s15d:'Scrie-ne'
  }
};
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const SC = [...document.querySelectorAll('.sc')];
const cv = $('bg'), cx = cv.getContext('2d');
document.documentElement.lang = LANG;
document.querySelectorAll('[data-k]').forEach(el => { el.innerHTML = TXT[LANG][el.dataset.k] || ''; });
if (LANG === 'ro') document.querySelector('#s8 [data-k="s8a"]').style.fontSize = '36px';

function fade(t, a, b, fi, fo){
  if (t < a || t > b) return 0;
  const i = eOut(seg(t, a, a + fi));
  const o = fo > 0 ? 1 - seg(t, b - fo, b) : 1;
  return Math.min(i, o);
}
function drawBg(t){
  const W = 1080, H = 1920;
  cx.fillStyle = '#0a0d12'; cx.fillRect(0, 0, W, H);
  const g = 120, off = (t * 16) % g;
  cx.strokeStyle = 'rgba(255,255,255,0.045)'; cx.lineWidth = 2; cx.beginPath();
  for (let x = off - g; x < W + g; x += g) { cx.moveTo(x, 0); cx.lineTo(x, H); }
  for (let y = off - g; y < H + g; y += g) { cx.moveTo(0, y); cx.lineTo(W, y); }
  cx.stroke();
  const orbs = [
    [.22 + .10 * Math.sin(t * .45), .20 + .04 * Math.cos(t * .33), .55, .20],
    [.86 + .08 * Math.cos(t * .29), .72 + .05 * Math.sin(t * .38), .50, .14]
  ];
  for (const [ox, oy, r, al] of orbs) {
    const x = ox * W, y = oy * H, R = r * W, gr = cx.createRadialGradient(x, y, 0, x, y, R);
    gr.addColorStop(0, `rgba(94,230,168,${al})`); gr.addColorStop(1, 'rgba(94,230,168,0)');
    cx.fillStyle = gr; cx.fillRect(0, 0, W, H);
  }
  const v = cx.createLinearGradient(0, 0, 0, H);
  v.addColorStop(0, 'rgba(10,13,18,.5)'); v.addColorStop(.45, 'rgba(10,13,18,0)'); v.addColorStop(1, 'rgba(10,13,18,.85)');
  cx.fillStyle = v; cx.fillRect(0, 0, W, H);
}
function frame(t){
  drawBg(t);
  $('prog').style.width = (100 * clamp(t / DUR)).toFixed(2) + '%';
  for (let k = 0; k < N; k++){
    const a = T[k], b = k + 1 < N ? T[k + 1] : DUR, u = t - a, sc = SC[k];
    sc.style.opacity = fade(t, a, b, .25, k === N - 1 ? 0 : .3);
    if (u < 0 || u > b - a + 1) continue;
    for (const el of sc.querySelectorAll('.e')){
      const d = parseFloat(el.dataset.d || 0), p = eOut(seg(u, d, d + .45));
      el.style.opacity = p;
      el.style.transform = `translateY(${((1 - p) * 16).toFixed(2)}px)`;
    }
    for (const el of sc.querySelectorAll('.fill')){
      const st = parseFloat(el.dataset.st || 0), du = parseFloat(el.dataset.du || 1), mx = parseFloat(el.dataset.mx || 1);
      el.style.width = (100 * mx * eOut(seg(u, st, st + du))).toFixed(2) + '%';
    }
  }
  $('num').textContent = Math.round(10 * eOut(seg(t - T[3], .2, 1.4)));
  $('price').textContent = Math.round(100 * eOut(seg(t - T[5], .1, .9))) + ' €';
  $('chkp').style.strokeDashoffset = (100 * (1 - eOut(seg(t - T[4], .3, 1.1)))).toFixed(2);
  const sp = eOut(seg(t - T[6], .1, .45)), st = $('stamp');
  st.style.opacity = sp;
  st.style.transform = `rotate(-6deg) scale(${(1 + .5 * (1 - sp)).toFixed(3)})`;
}
window.S = {frame};
</script>
